# ---------------------------------------------------------------------------
# Helix MQ - standalone broker, flat "key = value" format.
#
#   HELIX_DEMO_WORK=/srv/helix helixd --config standalone.conf
#
# ${HELIX_DEMO_WORK} is the only variable; it names a writable directory for the
# data and the port file. standalone.xml configures the exact same broker, so
# examples/demo/05_config_formats.sh can start both and compare them.
#
# Precedence, smallest to largest: built-in defaults, then every --config file
# in the order given, then the command-line flags.
# ---------------------------------------------------------------------------

# --- network ---------------------------------------------------------------
listen           = 127.0.0.1
port             = 0                      # 0 asks the kernel for a free port
port-file        = ${HELIX_DEMO_WORK}/standalone.port
max-conns        = 64

# --- broker ----------------------------------------------------------------
data-dir         = ${HELIX_DEMO_WORK}/standalone-data
max-fetch-bytes  = 262144
max-record-bytes = 65536                  # 64 KiB; the default is 1 MiB

# --- storage ---------------------------------------------------------------
segment-bytes    = 1048576
sync             = interval
sync-interval-ms = 25

# --- socket tuning (configuration-only keys: no flag sets them) -------------
listen-backlog    = 256
tcp-nodelay       = 1                      # 0 keeps Nagle's algorithm
recv-buffer-bytes = 262144                 # SO_RCVBUF cap, 0 = OS default
send-buffer-bytes = 262144                 # SO_SNDBUF cap
max-out-pending   = 262144                 # per-connection unsent output

# --- logging ---------------------------------------------------------------
log-level        = warn
