# Shared configuration of every node in the dockerized cluster (mounted at
# /etc/helix/cluster/helixd.conf). Node identity and bind address come from
# the cluster file, and --node-id is passed on the command line, so this file
# stays identical on all three nodes.
cluster-file     = /etc/helix/cluster/cluster.conf
data-dir         = ${HELIX_DATA_DIR}
sync             = ${HELIX_SYNC}
sync-interval-ms = 200
log-level        = ${HELIX_LOG_LEVEL}

max-conns        = 2000
max-fetch-bytes  = 4194304
ack-timeout-ms   = 5000
max-groups       = 1024
max-producers    = 1024
producer-ttl-ms  = 300000
