# Staging broker (mounted at /etc/helix/staging/helixd.conf).
# Durability is negotiated with production: HELIX_SYNC=always in .env.staging.
listen            = 0.0.0.0
port              = 9400
data-dir          = ${HELIX_DATA_DIR}
sync              = ${HELIX_SYNC}
sync-interval-ms  = 200
log-level         = ${HELIX_LOG_LEVEL}

segment-bytes     = 67108864
max-record-bytes  = 1048576
max-fetch-bytes   = 4194304
max-conns         = 2000

max-groups        = 1024
max-group-members = 8192
max-producers     = 1024
producer-ttl-ms   = 300000
max-out-pending   = 2097152
