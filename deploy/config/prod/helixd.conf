# Production broker (mounted at /etc/helix/prod/helixd.conf).
# HELIX_SYNC=always and HELIX_LOG_LEVEL=warn come from .env.prod.
listen            = 0.0.0.0
port              = 9400
data-dir          = ${HELIX_DATA_DIR}
sync              = ${HELIX_SYNC}
sync-interval-ms  = 200
log-level         = ${HELIX_LOG_LEVEL}

segment-bytes     = 268435456
max-record-bytes  = 4194304
max-fetch-bytes   = 8388608
max-conns         = 10000
max-out-pending   = 4194304

max-groups        = 65536
max-group-members = 65536
max-producers     = 65536
producer-ttl-ms   = 300000
max-open-logs     = 8192
max-offset-entries = 1048576

# Socket tuning: a larger backlog for reconnect storms, a bigger receive window
# for bulk fetches, and Nagle off so request/response latency stays low.
# Every key here is documented in docs/CONFIGURATION.md.
listen-backlog    = 4096
tcp-nodelay       = 1
recv-buffer-bytes = 1048576
send-buffer-bytes = 1048576
