# Development broker (mounted at /etc/helix/dev/helixd.conf).
# ${NAME} values are substituted from the container environment; compose sets
# them from .env.dev. A missing variable refuses the start instead of silently
# defaulting, so a misconfigured deployment fails fast.
listen            = 0.0.0.0
port              = 9400
data-dir          = ${HELIX_DATA_DIR}
sync              = ${HELIX_SYNC}
sync-interval-ms  = 100
log-level         = ${HELIX_LOG_LEVEL}

# Small enough to roll quickly, large enough for real payloads.
segment-bytes     = 16777216
max-record-bytes  = 1048576
max-fetch-bytes   = 1048576
max-conns         = 512

# Group and producer hygiene for a busy dev broker.
max-groups        = 64
max-group-members = 256
max-producers     = 64
producer-ttl-ms   = 60000
