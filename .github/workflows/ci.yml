name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -c 'actionlint -color .github/workflows/*.yml'
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang clang-tidy clang-format libclang-rt-18-dev valgrind shellcheck
          chmod +x scripts/*.sh
      - name: Shell syntax
        run: |
          for script in scripts/*.sh examples/demo/*.sh; do bash -n "$script"; done
          shellcheck -S error scripts/*.sh examples/demo/*.sh
      - name: Full quality gate
        run: |
          mkdir -p artifacts
          set -o pipefail
          make ci 2>&1 | tee artifacts/ci.log
        env:
          FUZZ_TIME: '30'
          CRASH_ROUNDS: '8'
          TEST_ARTIFACT_DIR: artifacts/protocol
      - name: Valgrind
        run: valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite,indirect build/test_broker
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-logs
          path: artifacts/
          retention-days: 14
  docker:
    name: Runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose files
        run: |
          docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml config --quiet
          docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose --env-file .env.cluster -f docker-compose.cluster.yml config --quiet
      - run: docker build --check .
      - run: docker build -t helix:ci -t helix-mq:local .
      - run: bash scripts/docker_smoke.sh helix:ci
      - name: Compose deployment (dev) and example walkthrough
        run: |
          set -o pipefail
          DC=(docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml)
          "${DC[@]}" up -d
          cid="$("${DC[@]}" ps -aq demo)"
          test -n "$cid"
          # `docker compose wait` has reported a bogus status; `docker wait` prints
          # the real exit code of the container the walkthrough ran in.
          code="$(docker wait "$cid")"
          "${DC[@]}" logs --no-log-prefix demo
          "${DC[@]}" exec -T helixd helixctl ping
          "${DC[@]}" down -v
          test "$code" = 0
          echo COMPOSE_WALKTHROUGH_PASSED
      - name: Compose deployment (cluster) and walkthrough
        run: |
          set -o pipefail
          DC=(docker compose --env-file .env.cluster -f docker-compose.cluster.yml)
          "${DC[@]}" up -d --build
          cid="$("${DC[@]}" ps -aq demo)"
          test -n "$cid"
          code="$(docker wait "$cid")"
          "${DC[@]}" logs --no-log-prefix demo
          "${DC[@]}" down -v
          test "$code" = 0
          echo COMPOSE_CLUSTER_WALKTHROUGH_PASSED
  portable:
    name: Portable ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test static release archive
        run: docker build --target release --output type=local,dest=dist .
      - name: Upload tested archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  distros:
    name: Portability (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
          - image: ubuntu:24.04
          - image: debian:12
          - image: alpine:3.20
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and run the examples on ${{ matrix.image }}
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" sh -c '
            set -e
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache bash build-base coreutils findutils make
            else
              apt-get update
              apt-get install -y --no-install-recommends bash build-essential
            fi
            make -j4 all test
            make --no-print-directory protocol
            HELIX_BIN_DIR=build bash scripts/config_test.sh
            HELIX_BIN_DIR=build bash examples/demo/run.sh
          '
          echo PORTABILITY_PASSED
